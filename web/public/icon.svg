<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2D5A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#38BDF8" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Compass / Route Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="16 12"/>

  <!-- Glowing Waypoint Arrow -->
  <g filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M256 96 L128 384 L256 320 Z" fill="url(#leftWing)"/>
    <!-- Right Wing -->
    <path d="M256 96 L256 320 L384 384 Z" fill="url(#rightWing)"/>
  </g>

  <!-- Center Guidance Node Beacon -->
  <circle cx="256" cy="240" r="28" fill="#0B132B" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="256" cy="240" r="12" fill="#38BDF8"/>
</svg>